server {
    listen 127.0.0.1:8080 default_server;
    server_name _;
    access_log /var/log/nginx/test-apps-access.log;
    error_log /var/log/nginx/test-apps-error.log warn;

    location = /api { return 404; }
    location ^~ /api/ { return 404; }
    location = /status.php { return 404; }
    location ^~ /nextcloud/ { return 404; }

    location /alpha/ {
        alias /var/www/test-apps/alpha/public/;
        try_files $uri $uri/ @alpha;
    }
    location @alpha {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/test-apps/alpha/public/index.php;
        fastcgi_param SCRIPT_NAME /alpha/index.php;
        fastcgi_param REQUEST_URI $request_uri;
        fastcgi_pass unix:/run/php/php8.4-fpm.sock;
    }

    location /beta/ {
        alias /var/www/test-apps/beta/public/;
        try_files $uri $uri/ @beta;
    }
    location @beta {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/test-apps/beta/public/index.php;
        fastcgi_param SCRIPT_NAME /beta/index.php;
        fastcgi_param REQUEST_URI $request_uri;
        fastcgi_pass unix:/run/php/php8.4-fpm.sock;
    }

    location / { return 404; }
    location ~ \.php$ { return 404; }
}
