[panel]
user = www-data
group = www-data
listen = /run/php/php8.4-fpm-panel.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660
pm = ondemand
pm.max_children = 2
pm.process_idle_timeout = 10s
pm.max_requests = 100
php_admin_value[memory_limit] = 64M
php_admin_flag[display_errors] = off
php_admin_flag[log_errors] = on
